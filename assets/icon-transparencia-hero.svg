  <circle cx="187" cy="94" r="6" fill="#075B31"/>

  <!-- Cadeado aberto: dados abertos -->
  <g transform="translate(64 190)">
    <rect x="-22" y="0" width="44" height="34" rx="7" fill="#0B7A3E"/>
    <path d="M-10 0v-10a12 12 0 0 1 24 0" fill="none" stroke="#0B7A3E" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="16" r="5" fill="#FFFFFF"/>
  </g>
